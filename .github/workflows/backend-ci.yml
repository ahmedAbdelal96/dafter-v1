name: Backend CI

on:
  push:
    branches: [main, master, "codex/**"]
    paths:
      - "daftar-api-v1/**"
      - "docs/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "daftar-api-v1/**"
      - "docs/**"

defaults:
  run:
    working-directory: daftar-api-v1

jobs:
  ci:
    name: Lint · Type-check · Prisma · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daftar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d daftar_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: daftar-api-v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: >-
          npx eslint
          "src/modules/accounting/**/*.ts"
          "src/modules/business-partners/**/*.ts"
          "src/modules/sales/**/*.ts"
          "src/modules/payment-terms/**/*.ts"
          "src/modules/accounting-bootstrap/**/*.ts"
          "src/modules/opening-balances/**/*.ts"
          "src/modules/customer-payments/**/*.ts"
          "src/common/types/auth.types.ts"
          "src/common/entitlements/feature-policy.manifest.ts"
          "src/app.module.ts"
          --max-warnings=0

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Install production-safe reference data
        run: npm run db:reference-data
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Seed deterministic test reference data
        run: npm run db:seed
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Verify production-safe reference data is replay-safe
        run: npm run db:reference-data
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Create Prisma shadow database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE daftar_shadow"
        env:
          PGPASSWORD: postgres

      - name: Verify Prisma migration diff
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code > /tmp/prisma-migration-diff.txt
          diff_status=$?
          set -e
          cat /tmp/prisma-migration-diff.txt
          if [ "$diff_status" -eq 0 ]; then
            exit 0
          fi
          if grep -E '  \[-\] ' /tmp/prisma-migration-diff.txt | grep -Ev \
            'Removed unique index on columns \(companyId, businessPartnerId, addressType\)|Removed unique index on columns \(companyId, businessPartnerId\)' \
            > /tmp/prisma-unexpected-diff.txt; then
            echo 'Unexpected Prisma migration/schema drift:'
            cat /tmp/prisma-unexpected-diff.txt
            exit 1
          fi
          if grep -q '  \[+\] \|  \[~\] ' /tmp/prisma-migration-diff.txt; then
            echo 'Unexpected Prisma migration/schema additions or changes:'
            exit 1
          fi
          expected_partial_indexes=$(grep -Ec \
            '  \[-\] Removed unique index on columns \(companyId, businessPartnerId, addressType\)|  \[-\] Removed unique index on columns \(companyId, businessPartnerId\)' \
            /tmp/prisma-migration-diff.txt || true)
          if [ "$expected_partial_indexes" -ne 2 ]; then
            echo 'Expected exactly two partial-index representation differences.'
            exit 1
          fi
          echo 'Only the two expected partial unique-index differences remain; Prisma cannot represent their WHERE predicates in schema.prisma.'
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"
          SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_shadow"

      - name: Run tests
        run: npm test -- --runInBand --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"
          JWT_SECRET: "ci-test-secret-at-least-32-chars-long"
          REDIS_URL: "redis://localhost:6379"

      - name: Build
        run: npm run build
