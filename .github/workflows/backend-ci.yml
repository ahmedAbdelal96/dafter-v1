name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "daftar-api-v1/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "daftar-api-v1/**"

defaults:
  run:
    working-directory: daftar-api-v1

jobs:
  ci:
    name: Lint · Type-check · Prisma · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daftar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d daftar_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: daftar-api-v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: >-
          npx eslint
          "src/modules/accounting/**/*.ts"
          "src/app.module.ts"
          --max-warnings=0

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"

      - name: Create Prisma shadow database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE daftar_shadow"
        env:
          PGPASSWORD: postgres

      - name: Verify Prisma migration diff
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"
          SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_shadow"

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daftar_test"
          JWT_SECRET: "ci-test-secret-at-least-32-chars-long"
          REDIS_URL: "redis://localhost:6379"

      - name: Build
        run: npm run build
