name: Web Dashboard CI

on:
  push:
    branches: [main, master]
    paths:
      - "daftar-dashboard/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "daftar-dashboard/**"

defaults:
  run:
    working-directory: daftar-dashboard

jobs:
  ci:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: daftar-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract checks
        run: npm run contracts:check && npm run roles:check && npm run i18n:check

      - name: Runtime contract tests
        run: npm run test:frontend

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:7000/api/v1"
          NEXT_PUBLIC_APP_NAME: "Dafter Dashboard"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_TOKEN_EXPIRY_DAYS: "7"
          NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS: "30"
          NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
          NEXT_PUBLIC_ENABLE_NOTIFICATIONS: "true"
          NEXT_PUBLIC_ENABLE_DEVTOOLS: "false"

