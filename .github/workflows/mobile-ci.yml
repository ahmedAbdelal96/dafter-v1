name: Mobile App CI

on:
  push:
    branches: [main, master]
    paths:
      - "hesba-dashboard-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "hesba-dashboard-mobile/**"

defaults:
  run:
    working-directory: hesba-dashboard-mobile

jobs:
  ci:
    name: Lint · Type-check · Expo Export check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hesba-dashboard-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Expo export check (web)
        run: npx expo export --platform web --output-dir /tmp/expo-export-check
        env:
          EXPO_ROUTER_APP_ROOT: src/app
          EXPO_PUBLIC_SENTRY_DSN: ""
        continue-on-error: true
