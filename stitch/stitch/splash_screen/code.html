<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hasba Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Noto+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f7a5a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f1b",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans Arabic", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
        }
        .premium-gradient {
            background: radial-gradient(circle at center, rgba(31, 122, 90, 0.15) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen overflow-hidden">
<div class="relative flex h-[812px] w-[375px] flex-col bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden rounded-[3rem] border-8 border-slate-900 dark:border-slate-800">
<div class="absolute inset-0 premium-gradient"></div>
<div class="relative flex flex-col items-center justify-center h-full w-full z-10 px-8">
<div class="mb-8 flex items-center justify-center">
<div class="w-24 h-24 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
</div>
<div class="text-center space-y-2">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-5xl font-bold leading-tight">
                    حسبة <span class="text-primary">Hasba</span>
</h1>
<p class="text-slate-600 dark:text-slate-400 text-lg font-medium tracking-wide uppercase">
                    Premium Financial Solutions
                </p>
</div>
<div class="mt-12 flex flex-col items-center gap-6">
<div class="flex flex-row items-center justify-center gap-3">
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary/40"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<p class="text-slate-500 dark:text-slate-500 text-sm font-light text-center max-w-[200px] leading-relaxed">
                    Elevating your wealth management experience
                </p>
</div>
</div>
<div class="absolute bottom-12 left-0 right-0 flex flex-col items-center space-y-2 z-10">
<div class="w-12 h-1 bg-primary/20 rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary rounded-full"></div>
</div>
<span class="text-[10px] text-slate-400 dark:text-slate-600 font-medium tracking-[0.2em] uppercase">Loading Secure Environment</span>
</div>
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20">
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-primary rounded-full blur-[100px]"></div>
</div>
</div>
</body></html>
