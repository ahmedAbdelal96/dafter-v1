<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f7a5a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f1b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark/95 backdrop-blur-md border-b border-primary/10">
<div class="flex items-center p-4 justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-pointer text-slate-900 dark:text-slate-100">arrow_forward</span>
<h1 class="text-lg font-bold leading-tight tracking-tight">إضافة أصناف</h1>
</div>
<button class="p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">help_outline</span>
</button>
</div>
<!-- Progress Stepper -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-2">
<div class="h-1.5 w-6 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-6 rounded-full bg-primary/20"></div>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- Search & Typeahead Section -->
<div class="px-4 py-4">
<div class="relative group">
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-primary">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full bg-primary/5 border border-primary/20 rounded-xl py-3 pr-12 pl-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-slate-100" placeholder="بحث عن صنف أو إضافة جديد..." type="text"/>
</div>
</div>
<!-- Quick Add Section -->
<div class="space-y-3 mb-6">
<h3 class="px-4 text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">الأصناف الأكثر مبيعاً</h3>
<div class="flex gap-2 overflow-x-auto px-4 no-scrollbar">
<button class="flex items-center gap-2 shrink-0 bg-primary/10 hover:bg-primary/20 border border-primary/20 rounded-full px-4 py-2 transition-colors">
<span class="material-symbols-outlined text-primary text-sm">add</span>
<span class="text-sm font-medium">استشارة قانونية</span>
</button>
<button class="flex items-center gap-2 shrink-0 bg-primary/10 hover:bg-primary/20 border border-primary/20 rounded-full px-4 py-2 transition-colors">
<span class="material-symbols-outlined text-primary text-sm">add</span>
<span class="text-sm font-medium">دعم فني</span>
</button>
<button class="flex items-center gap-2 shrink-0 bg-primary/10 hover:bg-primary/20 border border-primary/20 rounded-full px-4 py-2 transition-colors">
<span class="material-symbols-outlined text-primary text-sm">add</span>
<span class="text-sm font-medium">تجديد سنوي</span>
</button>
</div>
</div>
<!-- Line Items List -->
<div class="px-4 space-y-4">
<h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">الأصناف المضافة</h3>
<!-- Item Card 1 -->
<div class="bg-primary/5 dark:bg-white/5 border border-primary/10 rounded-xl p-4 flex flex-col gap-4">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-bold text-slate-900 dark:text-slate-100">خدمات سحابية ممتازة</span>
<span class="text-xs text-slate-500">ID: PRD-2049</span>
</div>
<button class="text-rose-500 p-1">
<span class="material-symbols-outlined text-lg">delete_outline</span>
</button>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3 bg-white dark:bg-background-dark border border-primary/10 rounded-lg p-1">
<button class="w-8 h-8 flex items-center justify-center rounded bg-primary/10 text-primary hover:bg-primary/20">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-8 text-center font-bold">02</span>
<button class="w-8 h-8 flex items-center justify-center rounded bg-primary text-white hover:bg-primary/90">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="text-left">
<div class="text-xs text-slate-500 mb-1">السعر</div>
<div class="font-bold text-primary">1,200.00 ر.س</div>
</div>
</div>
</div>
<!-- Item Card 2 -->
<div class="bg-primary/5 dark:bg-white/5 border border-primary/10 rounded-xl p-4 flex flex-col gap-4">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-bold text-slate-900 dark:text-slate-100">تركيب وبرمجة أنظمة</span>
<span class="text-xs text-slate-500">ID: PRD-1182</span>
</div>
<button class="text-rose-500 p-1">
<span class="material-symbols-outlined text-lg">delete_outline</span>
</button>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3 bg-white dark:bg-background-dark border border-primary/10 rounded-lg p-1">
<button class="w-8 h-8 flex items-center justify-center rounded bg-primary/10 text-primary hover:bg-primary/20">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-8 text-center font-bold">01</span>
<button class="w-8 h-8 flex items-center justify-center rounded bg-primary text-white hover:bg-primary/90">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="text-left">
<div class="text-xs text-slate-500 mb-1">السعر</div>
<div class="font-bold text-primary">450.00 ر.س</div>
</div>
</div>
</div>
<!-- Add New Custom Button -->
<button class="w-full border-2 border-dashed border-primary/30 rounded-xl py-4 flex items-center justify-center gap-2 text-primary hover:bg-primary/5 transition-all">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-bold">إضافة صنف مخصص</span>
</button>
</div>
</main>
<!-- Sticky Footer -->
<footer class="fixed bottom-0 left-0 right-0 bg-white dark:bg-background-dark/95 backdrop-blur-lg border-t border-primary/10 p-4 pb-8 z-20">
<div class="max-w-md mx-auto flex items-center justify-between gap-6">
<div class="flex flex-col">
<span class="text-xs text-slate-500 dark:text-slate-400">الإجمالي الشامل (3 أصناف)</span>
<div class="text-xl font-bold text-primary">2,850.00 <span class="text-sm font-normal">ر.س</span></div>
</div>
<button class="flex-1 bg-primary text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span>استمرار</span>
<span class="material-symbols-outlined text-sm">arrow_back</span>
</button>
</div>
</footer>
</body></html>
