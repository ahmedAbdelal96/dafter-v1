<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f7a5a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f1b",
                    },
                    fontFamily: {
                        "display": ["Noto Sans Arabic", "Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%231f7a5a' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
<div class="max-w-md mx-auto min-h-screen flex flex-col pb-8">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 justify-between">
<button class="text-slate-900 dark:text-slate-100 hover:bg-primary/10 p-2 rounded-lg transition-colors">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">تسوية المخزون</h2>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Search Bar -->
<div class="px-4 py-2">
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute right-3 text-primary">search</span>
<input class="w-full bg-slate-200/50 dark:bg-primary/10 border-none rounded-xl pr-10 pl-4 py-3 text-sm focus:ring-2 focus:ring-primary placeholder:text-slate-500 dark:placeholder:text-primary/50" placeholder="ابحث عن اسم المنتج أو الباركود" type="text"/>
</div>
</div>
</header>
<main class="flex-1 px-4 py-4 space-y-6">
<!-- Selected Product Card -->
<section>
<div class="bg-white dark:bg-primary/5 border border-slate-200 dark:border-primary/20 rounded-xl p-4 shadow-sm">
<div class="flex items-center gap-4">
<div class="size-20 bg-slate-100 dark:bg-primary/20 rounded-lg overflow-hidden shrink-0">
<img alt="منتج آيفون" class="w-full h-full object-cover" data-alt="Modern smartphone product photography against dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeptd2NByc6Gy4RUDhZRvavEcLoTRba-Mc1X59ciedlQxN6n97Uc2-j-tV1_nRQi3U8O7PmUo5eZOPKuvIuqaRW993TxbyxLgm8B1KoXDe_UZmvSXE2eOEcWtb7R2l1j1zN3HT-pkXZESUKJlCyYrnjkaxPquo8mKtowNbsVDDDRDbcCQ18HLOqw6WhZkgiWyQRCE_XtbUaHlAO-9KlHVSaUYJXUK32mAIhTvSDlpvMgmE_MIrPqKSuOUd4PQlkuh7e2fGVBm7NkA"/>
</div>
<div class="flex-1">
<span class="text-[10px] font-bold uppercase tracking-wider text-primary bg-primary/10 px-2 py-0.5 rounded">إلكترونيات</span>
<h3 class="text-base font-bold mt-1">آيفون 15 برو ماكس</h3>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-sm text-slate-400">inventory_2</span>
<p class="text-slate-500 dark:text-slate-400 text-xs">المخزون الحالي: <span class="text-slate-900 dark:text-slate-100 font-bold">42 وحدة</span></p>
</div>
</div>
</div>
</div>
</section>
<!-- Adjustment Details -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary">edit_note</span>
<h3 class="text-base font-bold leading-tight">تفاصيل التسوية</h3>
</div>
<!-- Adjustment Type -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400">نوع التسوية</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary/10 text-primary font-bold">
<span class="material-symbols-outlined">add_circle</span>
                            زيادة
                        </button>
<button class="flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-slate-200 dark:border-primary/20 text-slate-400 font-bold">
<span class="material-symbols-outlined">remove_circle</span>
                            نقص
                        </button>
</div>
</div>
<!-- Quantity -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400">الكمية المعدلة</label>
<div class="relative">
<input class="w-full bg-white dark:bg-primary/5 border border-slate-200 dark:border-primary/20 rounded-xl px-4 py-3 text-left font-mono focus:ring-2 focus:ring-primary" placeholder="0.00" type="number"/>
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs">وحدة</span>
</div>
</div>
<!-- Reason Selection -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400">سبب التسوية</label>
<select class="custom-select w-full bg-white dark:bg-primary/5 border border-slate-200 dark:border-primary/20 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary appearance-none">
<option value="">اختر السبب</option>
<option value="damage">تلف في المخزن</option>
<option value="correction">تصحيح جرد</option>
<option value="new">توريد جديد</option>
<option value="return">مرتجع مبيعات</option>
</select>
</div>
<!-- Notes Area -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400">ملاحظات إضافية</label>
<textarea class="w-full bg-white dark:bg-primary/5 border border-slate-200 dark:border-primary/20 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary placeholder:text-slate-500" placeholder="اكتب ملاحظاتك هنا..." rows="3"></textarea>
</div>
</section>
</main>
<!-- Fixed Action Button -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-primary/20">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined">save</span>
                حفظ التعديل
            </button>
</footer>
</div>
</body></html>
