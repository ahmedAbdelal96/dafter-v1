<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تعديل الملف الشخصي - حسبة</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f7a5a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f1b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-primary/10 sticky top-0 z-50">
<div class="flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_forward</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">تعديل الملف الشخصي</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center rounded-lg h-10 w-10 bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">done</span>
</button>
</div>
</header>
<!-- Profile Picture Section -->
<div class="flex p-6 @container">
<div class="flex w-full flex-col gap-6 items-center">
<div class="flex gap-4 flex-col items-center relative">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full min-h-32 w-32 border-4 border-primary/20" data-alt="صورة الملف الشخصي للمستخدم محمد العتيبي" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD1SRw41KizEGn7-Tq5JpS-YXIjxgVNr0DVadEOMLJFsr54R0CGvtRwzOfxa7r4rqlD0FQGA3eMCMuiIWNy3Al20hOZYYyM9-MxNPFxQ-TfWZbhOtVqQ3zjRX2Bn0c0hHNCQqhC3csHGc52mTh2itG9cGiBxJWXQnJQJZLzRqnNu86y_SMuKNpm21eHy48zcRhIXibNdfWfoRM-YYchP1Ux1II0aZrT3VUTModz_Xz4h5GTIIwaZqTWXbnKMqolDIsKLjzwnshlacc");'>
</div>
<label class="absolute bottom-1 right-1 bg-primary text-white p-2 rounded-full cursor-pointer shadow-lg hover:bg-primary/90 transition-all" for="profile-upload">
<span class="material-symbols-outlined text-sm">photo_camera</span>
<input class="hidden" id="profile-upload" type="file"/>
</label>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight text-center">محمد العتيبي</p>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-primary text-xs">workspace_premium</span>
<p class="text-primary text-sm font-medium leading-normal text-center">عضوية بريميوم</p>
</div>
</div>
</div>
<button class="flex min-w-[140px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-primary/10 text-primary text-sm font-bold leading-normal transition-all hover:bg-primary/20 w-full max-w-[480px]">
<span class="truncate">تغيير صورة الملف الشخصي</span>
</button>
</div>
</div>
<!-- Form Fields -->
<main class="flex-1 px-4 pb-32 max-w-[480px] mx-auto w-full space-y-4">
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pr-1">الاسم الكامل</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-primary/60">person</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-background-dark/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pr-12 pl-4 text-base font-normal leading-normal" placeholder="مثال: محمد بن سلمان العتيبي" type="text" value="محمد العتيبي"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pr-1">البريد الإلكتروني</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-primary/60">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-background-dark/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pr-12 pl-4 text-base font-normal leading-normal" placeholder="name@example.com" type="email" value="m.otaibi@hasba.sa"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pr-1">رقم الهاتف</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-primary/60">smartphone</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-background-dark/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pr-12 pl-4 text-base font-normal leading-normal text-right" dir="ltr" placeholder="+966 5X XXX XXXX" type="tel" value="+966 50 123 4567"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pr-1">المسمى الوظيفي</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-primary/60">work</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-background-dark/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pr-12 pl-4 text-base font-normal leading-normal" placeholder="مثال: محاسب مالي" type="text" value="مدير مالي"/>
</div>
</div>
<div class="pt-4">
<div class="flex items-center p-4 rounded-xl bg-primary/5 border border-primary/10">
<span class="material-symbols-outlined text-primary mr-0 ml-3">info</span>
<p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">تأكد من صحة البيانات المدخلة حيث سيتم استخدامها في التقارير والفواتير الرسمية الصادرة من "حسبة".</p>
</div>
</div>
</main>
<!-- Footer Action Button -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-primary/10 z-50">
<div class="max-w-[480px] mx-auto flex gap-3">
<button class="flex-1 h-14 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                    حفظ التغييرات
                </button>
<button class="px-6 h-14 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition-all">
                    إلغاء
                </button>
</div>
</footer>
</div>
