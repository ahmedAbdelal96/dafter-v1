services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: daftar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daftar_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-daftar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Redis Cache
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: daftar_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # NestJS API
  # ──────────────────────────────────────────
  api:
    build:
      context: ./hesba-api-v1
      dockerfile: Dockerfile
    container_name: daftar_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 7000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daftar_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
    ports:
      - "7000:7000"
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs

  # ──────────────────────────────────────────
  # Next.js Web Dashboard
  # ──────────────────────────────────────────
  web:
    build:
      context: ./hesba-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Hesba}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_TOKEN_EXPIRY_DAYS: "7"
        NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS: "30"
        NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
        NEXT_PUBLIC_ENABLE_NOTIFICATIONS: "true"
        NEXT_PUBLIC_ENABLE_DEVTOOLS: "false"
    container_name: daftar_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"

  # ──────────────────────────────────────────
  # PostgreSQL Auto-Backup
  # Runs daily at 02:00, keeps 30 days of backups
  # Backups stored in ./backups/ on the host
  # ──────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: daftar_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-daftar_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--compress=9"
      SCHEDULE: "0 2 * * *"       # every day at 02:00
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  api_logs:
